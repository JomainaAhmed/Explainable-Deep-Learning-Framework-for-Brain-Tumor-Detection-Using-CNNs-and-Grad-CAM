# ONCONET Hyperparameter Tuning and Ablation Experiment Configuration

hyperparameters:
  learning_rates: [0.1, 0.01, 0.001, 0.0001]
  batch_sizes: [16, 32, 64]
  optimizers: ["adam", "adamw", "sgd"]

ablation:
  model_a:
    name: "No BatchNorm"
    use_batch_norm: false
    dropout: 0.4
    use_aug: true
  model_b:
    name: "No Dropout"
    use_batch_norm: true
    dropout: 0.0
    use_aug: true
  model_c:
    name: "No Data Aug"
    use_batch_norm: true
    dropout: 0.4
    use_aug: false
  model_d:
    name: "Full Architecture"
    use_batch_norm: true
    dropout: 0.4
    use_aug: true

augmentations:
  rotations: [0, 15, 30, 45]
  flips: ["none", "horizontal", "vertical", "both"]
  noise: [0.0, 0.01, 0.05, 0.1] # standard deviations for Gaussian noise
